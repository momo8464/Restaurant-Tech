<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description -->
    <meta
        name="description"
        content="Contactez Restaurant Tech pour toute information ou commande."
    >

    <title>Contact | Restaurant Tech</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <img
                src="img/logo.png"
                alt="Logo du Restaurant Tech"
            >
        </a>

        <!-- NAVIGATION -->
        <nav aria-label="Navigation principale">

            <ul>
                <li>
                    <a href="index.html">Accueil</a>
                </li>

                <li>
                    <a href="index.html#apropos">À propos</a>
                </li>

                <li>
                    <a href="menu.html">Menu</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>
            </ul>

        </nav>

    </header>


    <!-- =========================
         CONTENU PRINCIPAL
    ========================== -->

    <main id="contact">

        <!-- INTRODUCTION -->

        <section class="contact-introduction">

            <h1>Contactez-nous</h1>

            <p>
                Une question, une demande d'information ou une commande ?
                N'hésitez pas à nous contacter.
            </p>

        </section>


        <!-- =========================
             FORMULAIRE
        ========================== -->

        <section class="contact-container">

            <form action="#" method="post">

                <fieldset>

                    <legend>Formulaire de contact</legend>


                    <!-- NOM -->

                    <div class="contact">

                        <label for="nom">
                            Nom
                        </label>

                        <input
                            type="text"
                            id="nom"
                            name="nom"
                            placeholder="Entrez votre nom"
                            autocomplete="family-name"
                            required
                        >

                    </div>


                    <!-- PRÉNOM -->

                    <div class="contact">

                        <label for="prenom">
                            Prénom
                        </label>

                        <input
                            type="text"
                            id="prenom"
                            name="prenom"
                            placeholder="Entrez votre prénom"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="contact">

                        <label for="email">
                            Adresse e-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemple@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- TÉLÉPHONE -->

                    <div class="contact">

                        <label for="telephone">
                            Numéro de téléphone
                        </label>

                        <input
                            type="tel"
                            id="telephone"
                            name="telephone"
                            placeholder="+225 05 84 64 34 99"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- MESSAGE -->

                    <div class="contact">

                        <label for="message">
                            Votre message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Écrivez votre message ici..."
                            rows="6"
                            required
                        ></textarea>

                    </div>


                    <!-- BOUTONS -->

                    <div class="button-contact">

                        <button type="submit">
                            Envoyer
                        </button>

                        <button type="reset" class="button-reset">
                            Effacer
                        </button>

                    </div>

                </fieldset>

            </form>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-content">

            <p>
                &copy; 2026 Restaurant Tech. Tous droits réservés.
            </p>

            <nav aria-label="Informations de contact">

                <a
                    href="mailto:konemhd2003@gmail.com"
                    class="footer-email"
                >
                    E-mail
                </a>

                <a
                    href="tel:+2250584643499"
                    class="footer-phone"
                    aria-label="Appeler le Restaurant Tech"
                >
                    <img
                        src="img/telephone_logo.png"
                        alt=""
                        class="logo-footer"
                    >
                </a>

            </nav>

        </div>

    </footer>

</body>

</html>
